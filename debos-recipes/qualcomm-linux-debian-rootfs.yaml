      # version outside of the desktop list. libcamera-v4l2 provides a
      # LD_PRELOAD library for compatiblity with apps relying on v4l2
      # (similar to pipewire and pulse situation)
      - gstreamer1.0-libcamera
      - libcamera-tools
      - libcamera-v4l2
{{- end }}

  - action: run
    description: Set default locale
    chroot: true
    command: |
      set -eux
      if which locale-gen >/dev/null 2>&1; then
          echo en_US.UTF-8 UTF-8 >>/etc/locale.gen
          locale-gen
          update-locale LANG=en_US.UTF-8
      fi

{{- if ne $buildid "" }}
  - action: run
    description: Set build and variant ID in /etc/buildinfo
    chroot: true
    command: |
      set -eux
      touch /etc/buildinfo
      chmod 644 /etc/buildinfo
      echo "BUILD_ID={{$buildid}}" >>/etc/buildinfo
      echo "VARIANT_ID={{$variantid}}" >>/etc/buildinfo
{{- end }}

  # usually these packages are pulled by Pre-Depends/Depends/Recommends of
  # Debian's linux-image, but kernel packages generated with the upstream
  # deb-pkg target don't have these dependencies, so install these before
  # installing kernels; this is a separate step because of the Pre-Depends
  - action: apt
    description: Install kernel dependencies
    recommends: true
    packages:
      - apparmor
{{- if eq $suite "trixie" }}
      - initramfs-tools
{{- else }}
      - dracut
{{- end }}
      - kmod
      - linux-base

  - action: apt
    description: Install kernel and firmware packages
    recommends: true
    packages:
      - firmware-atheros
      - firmware-qcom-soc
{{- if ne $kernelpackage "none" }}
      - {{$kernelpackage}}
{{- end }}

  # this is currently needed on boards such as RB1 which are using Android
  # bootloader to check the boot count of the boot_a/boot_b partitions
  - action: apt
    description: Support boards chainloading from Android bootloader
    recommends: true
    packages:
      # marks the current Android boot partition as booted successfully
      - qbootctl

{{- if ne $localdebs "none" }}
  - action: overlay
    description: Overlay local debs directory {{ $localdebs }} to /root/
    source: {{ $localdebs }}
    destination: /root/

  - action: run
    description: Install local kernel/firmware debs (linux-image, modules, DTB)
    chroot: true
    command: |
      set -eux
      if ! ls /root/*.deb >/dev/null 2>&1; then
        echo "ERROR: no .deb files found in localdebs ({{ $localdebs }})" >&2
        echo "Run: make BOARD=<board> prepare-board  (or copy debs into debos-recipes/local-debs/)" >&2
        exit 1
      fi
      # Require exactly one linux-image .deb to avoid installing multiple
      # kernels and ambiguous DTB/module selection later.
      set -- /root/linux-image-*.deb
      if [ "$#" -eq 0 ] || [ ! -f "$1" ]; then
        echo "ERROR: localdebs must include linux-image-*.deb (kernel + modules + DTB)" >&2
        ls -la /root/ >&2 || true
        exit 1
      fi
      if [ "$#" -ne 1 ]; then
        echo "ERROR: expected exactly one linux-image-*.deb, found $#:" >&2
        printf '  %s\n' "$@" >&2
        exit 1
      fi
      linux_image_deb=$1
      # Install linux-image first (vmlinuz + modules + DTB), then the rest.
      # --allow-downgrades: local linux-libc-dev / headers may be older than
      # the Debian suite's already-installed linux-libc-dev.
      apt-get -y --allow-downgrades install "$linux_image_deb"
      for deb in /root/*.deb; do
        [ "$deb" = "$linux_image_deb" ] && continue
        apt-get -y --allow-downgrades install "$deb"
      done
{{- if ne $requireddtb "none" }}
      # Ensure the board's required DTB and modules came from the local linux-image
      dtb=$(ls -1 /usr/lib/linux-image-*/{{ $requireddtb }} | head -1)
      test -f "$dtb"
      echo "Installed required DTB: $dtb"
      kver=$(basename "$(dirname "$(dirname "$dtb")")")
      kver=${kver#linux-image-}
      test -d "/lib/modules/${kver}"
      test -e "/boot/vmlinuz-${kver}"
      echo "Installed kernel ${kver} (image + modules + DTB) from local debs"
{{- end }}
      # no need to keep these
      rm -vf /root/*.deb
{{- end }}

{{- if ne $aptlocalrepo "none" }}
  - action: run
    description: Remove bind mount of local APT repository
    chroot: false
    command: |
      set -eux
      umount "${ROOTDIR}/media/apt-local-repo"
      rmdir -v "${ROOTDIR}/media/apt-local-repo"

  - action: run
    description: APT update without local APT repository
    chroot: true
    command: |
      set -eux
      rm -v /etc/apt/sources.list.d/apt-local-repo.sources
      apt-get update
{{- end }}

{{- if $snapshot }}
  - action: run
    description: Restore APT sources to live mirrors
    chroot: true
    command: |
      set -eux
      apt-snapshot-toggle disable
{{- end }}

  - action: run
    description: Create DTBs tarball
    chroot: false
    command: |
      set -eux
      # find the highest kernel version installed; kernels are backwards
      # compatible with older dtbs, so it would make sense to take dtbs from
      # the oldest available kernel as to allow all kernels to boot, but if
      # this image has pulled a more recent kernel, it's probably to gain
      # support for new hardware which would happen through new or updated dtbs
      # only in that new kernel, so use the latest dtbs
      # list kernel directories to avoid silent pipeline failure
      kernel_dirs=$(ls -d "$ROOTDIR"/usr/lib/linux-image-*)
      latest_kernel=$(echo "$kernel_dirs" | sort -V | tail -1)
      # transform pathnames to strip the leading ./
      tar \
          -C "${latest_kernel}" \
          --transform='s|^\./||' \
          -cvzf "$ARTIFACTDIR/dtbs.tar.gz" \
          .

  - action: pack
    description: Create root filesystem tarball
    file: rootfs.tar
    compression: none

