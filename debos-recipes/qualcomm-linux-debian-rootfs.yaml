# Generic Qualcomm Linux defaults. Product boards override via make BOARD=<name>
# (see boards/*.yaml and scripts/board-config.py).
{{- $hostname := or .hostname "debian" }}
{{- $username := or .username "debian" }}
{{- $password := or .password "debian" }}
{{- $rootpassword := or .rootpassword "root" }}
{{- $forcepasswordchange := or .forcepasswordchange "true" }}
{{- $xfcedesktop := or .xfcedesktop "false" }}
{{- $gnomedesktop := or .gnomedesktop "false" }}
{{- $vnc := or .vnc "false" }}
{{- $vncpassword := or .vncpassword $password }}
{{- $vncgeometry := or .vncgeometry "1280x800" }}
{{- $vncdisplay := or .vncdisplay "1" }}
{{- $vnclocalhost := or .vnclocalhost "false" }}
{{- $vnclocalhostflag := "no" }}
{{- if eq $vnclocalhost "true" }}
{{- $vnclocalhostflag = "yes" }}
{{- end }}
{{- $localdebs := or .localdebs "none" }}
{{- $aptlocalrepo := or .aptlocalrepo "none" }}
{{- $kernelpackage := or .kernelpackage "linux-image-arm64" }}
{{- $requireddtb := or .requireddtb "none" }}
{{- $extrapackages := or .extrapackages "none" }}
{{- $overlays := or .overlays "qsc-deb-releases" }}
{{- $buildid := or .buildid "" }}
{{- $snapshot := or .snapshot "" }}
{{- $suite := or .suite "trixie" }}

{{- $variantid := "console" }}
{{- if eq $xfcedesktop "true" }}
{{- $variantid = "xfce" }}
{{- else if eq $gnomedesktop "true" }}
{{- $variantid = "gnome" }}
{{- end }}

# Rename sid to unstable to reduce if/else complexity
{{- if eq $suite "sid" }}
{{- $suite = "unstable" }}
{{- end }}

architecture: arm64

actions:
  - action: mmdebstrap
    description: Bootstrap initial filesystem
    suite: {{ $suite }}
    components:
      - main
      - contrib
      - non-free
      - non-free-firmware
    mirrors: ['http://deb.debian.org/debian']
    variant: minbase
    # ca-certificates required in early bootstrap for possible https apt overlays later
    include: [ca-certificates]

{{- if ne $aptlocalrepo "none" }}
  - action: run
    description: Setup bind mount of local APT repository
    chroot: false
    command: |
      set -eux
      mkdir -v "${ROOTDIR}/media/apt-local-repo"
      mount --bind {{$aptlocalrepo}} "${ROOTDIR}/media/apt-local-repo"

  - action: run
    description: Setup APT sources for local APT repository
    chroot: true
    command: |
      set -eux
      cat >/etc/apt/sources.list.d/apt-local-repo.sources <<EOF
      Types: deb
      URIs: file:///media/apt-local-repo
      Suites: /
      Trusted: true
      EOF
{{- end }}

{{- if $snapshot }}
  - action: run
    description: Install apt-snapshot-toggle into rootfs
    chroot: false
    command: |
      set -eux
      cat > "${ROOTDIR}/usr/local/bin/apt-snapshot-toggle" <<'TOGGLE'
      #!/bin/sh
      mode="$1"
      for f in /etc/apt/sources.list.d/*.sources; do
          case "$f" in
            */snapshot_*) want=$([ "$mode" = "enable" ] && echo yes || echo no) ;;
            *)             want=$([ "$mode" = "enable" ] && echo no  || echo yes) ;;
          esac
          if ! grep -q "^Enabled:" "$f"; then
              echo "Warning: no Enabled: field in ${f}" >&2
          else
              sed -i "s/^Enabled:.*/Enabled: ${want}/" "$f"
          fi
      done
      TOGGLE
      chmod +x "${ROOTDIR}/usr/local/bin/apt-snapshot-toggle"
{{- end }}

  # after debootstrap, only a basic etc/apt/sources.list is created; add more
  # modern etc/apt/sources.list.d/*.sources; sources.list is removed after
  # applying all overlays, and followed by an APT update and full-upgrade
  - action: run
    description: Create APT sources for debian {{ $suite }}
    chroot: true
    command: |
      set -eux
{{- if $snapshot }}
      if echo "{{ $snapshot }}" | grep -qE '^([0-9]{8}|[0-9]{8}T[0-9]{6}Z)$'; then
        SNAPSHOT="{{ $snapshot }}"
      else
        echo "ERROR: invalid snapshot '{{ $snapshot }}'. Use: YYYYMMDD | YYYYMMDDTHHMMSSZ" >&2
        exit 1
      fi
      touch /etc/buildinfo && chmod 644 /etc/buildinfo
      echo "SNAPSHOT=${SNAPSHOT}" >> /etc/buildinfo
{{- end }}
      tee /etc/apt/sources.list.d/debian.sources <<EOF
      # Debian archive
      Types: deb
      URIs: http://deb.debian.org/debian/
      Suites: {{ $suite }}
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
      Enabled: yes

{{- if ne $suite "unstable" }}

      # Debian stable updates
      Types: deb
      URIs: http://deb.debian.org/debian/
      Suites: {{ $suite }}-updates
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
      Enabled: yes

      # Debian security updates
      Types: deb
      URIs: http://deb.debian.org/debian-security/
      Suites: {{ $suite }}-security
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
      Enabled: yes
{{- end }}
      EOF

{{- if $snapshot }}
      # Derive snapshot_debian.sources from debian.sources by rewriting mirror URLs
      sed \
        -e "s#http://deb\.debian\.org/debian/#https://snapshot.debian.org/archive/debian/${SNAPSHOT}/#g" \
        -e "s#http://deb\.debian\.org/debian-security/#https://snapshot.debian.org/archive/debian-security/${SNAPSHOT}/#g" \
        -e "/^Enabled:/a\\# TODO: remove Check-Valid-Until once Debusine-based snapshots are available" \
        -e "/^Enabled:/a\\Check-Valid-Until: no" \
        /etc/apt/sources.list.d/debian.sources \
        > /etc/apt/sources.list.d/snapshot_debian.sources
      apt-snapshot-toggle enable
{{- end }}

{{- if and (ne $suite "unstable") (ne $suite "testing") }}
  - action: run
    description: Add Debian {{ $suite }}-backports APT configuration
    chroot: true
    command: |
      set -eux
{{- if $snapshot }}
      SNAPSHOT=$(grep '^SNAPSHOT=' /etc/buildinfo | cut -d= -f2)
{{- end }}
      tee /etc/apt/sources.list.d/debian-backports.sources <<EOF
      # Debian backports
      Types: deb
      URIs: http://deb.debian.org/debian
      Suites: {{ $suite }}-backports
      Components: main contrib non-free non-free-firmware
      Enabled: yes
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
      EOF

{{- if $snapshot }}
      # Derive snapshot_debian-backports.sources from debian-backports.sources by rewriting mirror URLs
      sed \
        -e "s#http://deb\.debian\.org/debian/#https://snapshot.debian.org/archive/debian/${SNAPSHOT}/#g" \
        -e "s#http://deb\.debian\.org/debian\$#https://snapshot.debian.org/archive/debian/${SNAPSHOT}/#" \
        -e "/^Enabled:/a\\# TODO: remove Check-Valid-Until once Debusine-based snapshots are available" \
        -e "/^Enabled:/a\\Check-Valid-Until: no" \
        /etc/apt/sources.list.d/debian-backports.sources \
        > /etc/apt/sources.list.d/snapshot_debian-backports.sources
      apt-snapshot-toggle enable
{{- end }}
      tee /etc/apt/preferences.d/debian-backports.pref <<EOF
      # for binary packages built from these source packages, score the version from
      # Debian backports higher as to get hardware enabled or better hardware support

      Package: src:alsa-ucm-conf:any src:fastrpc src:firmware-free:any src:firmware-nonfree:any src:hexagon-dsp-binaries src:linux:any src:linux-signed-arm64:any src:mesa:any src:u-boot-efi-dtb
      Pin: release n={{ $suite }}-backports
      Pin-Priority: 900
      EOF
{{- end }}

{{- if ne $overlays "none" }}
{{- range $overlay := split "," $overlays }}
  - action: overlay
    description: Apply overlay {{$overlay}}
    source: overlays/{{$overlay}}
{{- end }}
{{- end }}

# QArtifactory is missing a Release file for some suites.
{{- if and (ne $suite "testing") (ne $suite "forky") }}
  # The qsc-deb-releases overlay only ships the keyring (.asc); generate the
  # .sources and .pref files dynamically to use the correct $suite-overlay
  - action: run
    description: Create qsc-deb-releases APT sources for {{ $suite }}-overlay
    chroot: true
    command: |
      set -eux
      # only generate if the keyring was installed by the overlay
      if [ ! -f /etc/apt/keyrings/qsc-deb-releases.asc ]; then
        exit 0
      fi
      tee /etc/apt/sources.list.d/qsc-deb-releases.sources <<EOF
      # QArtifactory qsc-deb-releases repository
      # NB: publishing Sources indices for deb-src isn't supported by Artifactory,
      # but sources are published with other packages files
      Types: deb
      URIs: https://qartifactory-edge.qualcomm.com/artifactory/qsc-deb-releases
      Suites: {{ $suite }}-overlay
      Components: main
      Signed-By: /etc/apt/keyrings/qsc-deb-releases.asc
      Enabled: yes
      EOF
      tee /etc/apt/preferences.d/qsc-deb-releases.pref <<EOF
      # for binary packages built from these source packages, score the version from
      # {{ $suite }}-overlay higher than versions from Debian for compliance
      Package: src:pipewire:any
      Pin: release n={{ $suite }}-overlay
      Pin-Priority: 950
      EOF
{{- end }}

  - action: run
    description: Remove old APT sources and upgrade packages
    chroot: true
    command: |
      set -eux
      # remove old style, incomplete sources, superseded in apt-sources overlay
      rm -vf /etc/apt/sources.list
{{- if $snapshot }}
      SNAPSHOT=$(grep '^SNAPSHOT=' /etc/buildinfo | cut -d= -f2)
      for f in /etc/apt/sources.list.d/*.sources; do
          case "$f" in */snapshot_*) continue ;; esac
          if grep -q "^Enabled: yes" "$f"; then
              echo "Warning: $(basename "$f" .sources) has no snapshot support; packages from this source will be the latest available" >&2
          fi
      done
{{- end }}
      # APT update and upgrade to pickup changes from overlays
      apt-get -y update
      apt-get -y full-upgrade

  - action: apt
    description: Install foundational packages
    recommends: true
    packages:
      # Android Debug Bridge (daemon)
      - adbd
      # bluetooth
      - bluez
      # vfat tools, notably fsck.fat for the ESP
      - dosfstools
      # ext4 tools, notably e2fsck for the root filesystem
      - e2fsprogs
      # fwupd tools, enable OTA EFI firmware capsule updates
      - fwupd
      # defaults to "systemd-sysv"; perhaps not needed
      - init
      # Bluetooth audio support in PipeWire
      - libspa-0.2-bluetooth
      # libcamera support in PipeWire
      - libspa-0.2-libcamera
      # Ethernet, Wi-Fi, WWAN; built-in DHCP client
      - network-manager
      # wireless tooling (iw / iwlist helpers used with NM)
      - iw
      # standard networking files (/etc/hosts, /etc/services etc.)
      - netbase
      # audio
      - pipewire
      # Qualcomm Remote Filesystem Service; needed for WiFi on
      # some ath10k devices such as on RB1
      - rmtfs
      # TFTP server implementation for the QRTR protocol; needed for WiFi on
      # some ath10k devices such as on RB1
      - tqftpserv
      # dynamic device nodes handling
      - udev
      # database of radio emission regulations; needed for WiFi
      - wireless-regdb
      # WPA / WPA2 / WPA3 client support
      - wpasupplicant

{{- if eq $suite "trixie" }}
{{- if ne $overlays "none" }}
{{- range $overlay := split "," $overlays }}
{{- if eq $overlay "qsc-deb-releases" }}
  # fastrpc-tests is only available in trixie-overlay
  - action: apt
    description: Install fastrpc-tests (trixie only)
    recommends: true
    packages:
      # fastrpc support. fastrpc-tests pulls in the required stack
      - fastrpc-tests
{{- end }}
{{- end }}
{{- end }}
{{- end }}

  - action: run
    description: Set hostname to "{{ $hostname }}"
    chroot: true
    command: |
      set -eux
      echo {{ $hostname }} >/etc/hostname
      # /etc/hosts is created by netbase
      sed -i "1s/^/127.0.1.1	{{ $hostname }}\n/" /etc/hosts

  - action: run
    description: Add a "{{ $username }}" user, add it to sudoers and various groups
    chroot: true
    command: |
      set -eux
      # pre-emptively create a sudo group if sudo isn't installed
      getent group sudo >/dev/null 2>&1 || groupadd --system sudo
      # some useful groups for desktop scenarios, but also to run payloads
      # from the serial console, over SSH, or in containers - where the desktop
      # session has not updated ACLs to the device nodes
      groups="adm,audio,render,sudo,users,video"
      # fastrpc group only exists when fastrpc-support is installed (Debian)
      if getent group fastrpc >/dev/null 2>&1; then
        groups="${groups},fastrpc"
      fi
      # hardware / networking groups used on product boards (when present)
      for g in plugdev dialout netdev; do
        if getent group "$g" >/dev/null 2>&1; then
          groups="${groups},${g}"
        fi
      done
      useradd --create-home --shell /bin/bash --user-group \
          --groups "$groups" {{ $username }}
      echo {{ $username }}:{{ $password }} | chpasswd
      echo root:{{ $rootpassword }} | chpasswd
{{- if eq $forcepasswordchange "true" }}
      # password must be changed on first login
      chage --lastday 0 {{ $username }}
{{- end }}
      # sbin tools on PATH for interactive shells
      printf '\nexport PATH=$PATH:/usr/local/sbin:/usr/sbin:/sbin\n' \
          >> /home/{{ $username }}/.bashrc
      mkdir -v --mode 755 --parents /etc/sudoers.d
      # Board overlays may ship /etc/sudoers.d/user (password required).
      # Otherwise install the upstream NOPASSWD rule for the default user.
      if [ -f /etc/sudoers.d/user ]; then
        chmod 440 /etc/sudoers.d/user
      else
        (
          umask 226
          echo "{{ $username }} ALL=(ALL) NOPASSWD:ALL" >/etc/sudoers.d/90-debos
        )
      fi
      # ensure a fresh machine-id is generated on first boot
      rm -f /etc/machine-id /var/lib/dbus/machine-id

  # NB: Recommends pull in way too many packages, and we don't need to follow
  # Recommends reaching outside of this Priority level
  - action: apt
    description: Install packages of priority "important" (only from Debian)
    recommends: false
    packages:
      - ?origin(Debian) ?priority(important)

  # NB: Recommends pull in way too many packages, and we don't need to follow
  # Recommends reaching outside of this Priority level
  - action: apt
    description: Install packages of priority "standard" (only from Debian)
    recommends: false
    packages:
      - ?origin(Debian) ?priority(standard)

  # TODO remove Priority: standard packages from this list?
  - action: apt
    description: Install a comfortable package set
    recommends: true
    packages:
      - alsa-utils
      - clinfo
      # used to debug clock issues
      - debugcc
      - device-tree-compiler
      - docker.io
      # used to debug ethernet speed auto-neg issues
      - ethtool
      - i2c-tools
      - locales
      - mesa-opencl-icd
      - mesa-utils-bin
      # convenience networking commands (arp, ifconfig, route etc.)
      - net-tools
      - openssh-client
      # lspci
      - pciutils
      - rfkill
      - sudo
      # lsusb
      - usbutils
      # media-ctl
      - v4l-utils
      - vim
      - vulkan-tools
      - wget

{{- if ne $extrapackages "none" }}
  - action: apt
    description: Install board-specific extra packages
    recommends: true
    packages:
{{- range $pkg := split "," $extrapackages }}
      - {{ $pkg }}
{{- end }}
{{- end }}

  - action: run
    description: Enable dynamic MOTD scripts if present
    chroot: true
    command: |
      set -eux
      # Prefer dynamic /etc/update-motd.d over a static /etc/motd
      rm -f /etc/motd
      if [ -d /etc/update-motd.d ]; then
        find /etc/update-motd.d -type f -exec chmod 755 {} +
      fi

  - action: run
    description: Add default user to docker group
    chroot: true
    command: |
      set -eux
      usermod -a -G docker {{ $username }}

{{- if eq $xfcedesktop "true" }}
  # this should ideally be task-xfce-desktop, but this pulls too many apps;
  # instead, curate from the Depends and Recommends of task-xfce-desktop and
  # task-desktop recursively; also, disable Recommends
  - action: apt
    description: Install Xfce desktop
    recommends: false
    packages:
      # preempt these dependencies as to avoid pulling all backends
      - xserver-xorg-input-libinput
      - xserver-xorg-video-fbdev
      - xserver-xorg-input-all-
      - xserver-xorg-video-all-
      - xserver-xorg
      - plymouth-label- # we probably don't need a boot splash
      # nm-connection-editor below depends on polkit-1-auth-agent, and APT
      # picks up ukui-polkit as a random Provides; select mate-polkit instead
      - mate-polkit
      # from task-xfce-desktop (+ VNC guide extras)
      - xfce4
      - xfce4-goodies
      - dbus-x11
      - lightdm
      - light-locker
      - xfce4-terminal
      - tango-icon-theme
      - network-manager-applet
      - nm-connection-editor
      - synaptic
      # from task-desktop
      - desktop-base
      - xdg-utils
      - fonts-symbola
      - avahi-daemon
      - libnss-mdns
      # browser
      - chromium
{{- if eq $vnc "true" }}
      # TigerVNC (tigervnc-tools provides tigervncpasswd / vncpasswd)
      - tigervnc-standalone-server
      - tigervnc-common
      - tigervnc-tools
{{- end }}
      - xterm
      # bluetooth settings
      - blueman
      # audio: wireplumber for session integration, pipewire-pulse for chromium
      # and xfce4-pulseaudio-plugin, and pavucontrol as referenced from the
      # xfce pulse panel applet
      - pavucontrol
      - pipewire-pulse
      - wireplumber
      # camera: mostly supported through pipewire, but pull the qcam app
      # and cam CLI tool from libcamera-tools; also install libcamera
      # gstreamer plugins for for gstreamer based apps; ideally, cam and
      # qcam would be packaged separately as to allow pulling the CLI
      # version outside of the desktop list. libcamera-v4l2 provides a
      # LD_PRELOAD library for compatiblity with apps relying on v4l2
      # (similar to pipewire and pulse situation)
      - gstreamer1.0-libcamera
      - libcamera-tools
      - libcamera-v4l2

  - action: run
    description: Set Chromium as default www-browser
    chroot: true
    command: |
      set -eux
      update-alternatives --install /usr/bin/www-browser www-browser /usr/bin/chromium 100
      update-alternatives --set www-browser /usr/bin/chromium
      if [ -e /usr/bin/x-www-browser ] || update-alternatives --list x-www-browser >/dev/null 2>&1; then
        update-alternatives --install /usr/bin/x-www-browser x-www-browser /usr/bin/chromium 100 || true
        update-alternatives --set x-www-browser /usr/bin/chromium || true
      fi

{{- if eq $vnc "true" }}
  - action: run
    description: Configure TigerVNC for {{ $username }} (XFCE, systemd)
    chroot: true
    command: |
      set -eux
      # Persist correct /tmp/.X11-unix permissions (common VNC failure point)
      mkdir -p /etc/tmpfiles.d
      cat >/etc/tmpfiles.d/x11-unix.conf <<'EOF'
      d /tmp/.X11-unix 1777 root root -
      EOF
      # Apply now inside the image build as well
      rm -rf /tmp/.X11-unix
      mkdir -p /tmp/.X11-unix
      chmod 1777 /tmp/.X11-unix
      chown root:root /tmp/.X11-unix

      install -d -o {{ $username }} -g {{ $username }} -m 755 /home/{{ $username }}/.vnc
      cat >/home/{{ $username }}/.vnc/xstartup <<'EOF'
      #!/bin/bash
      unset SESSION_MANAGER
      unset DBUS_SESSION_BUS_ADDRESS
      exec startxfce4
      EOF
      chmod 755 /home/{{ $username }}/.vnc/xstartup
      # Debian provides tigervncpasswd; vncpasswd may be an alternatives symlink
      if command -v vncpasswd >/dev/null 2>&1; then
        VNCPASSWD=vncpasswd
      elif command -v tigervncpasswd >/dev/null 2>&1; then
        VNCPASSWD=tigervncpasswd
      else
        echo "ERROR: neither vncpasswd nor tigervncpasswd found (install tigervnc-tools)" >&2
        exit 1
      fi
      printf '%s\n' '{{ $vncpassword }}' | "$VNCPASSWD" -f >/home/{{ $username }}/.vnc/passwd
      chmod 600 /home/{{ $username }}/.vnc/passwd
      chown -R {{ $username }}:{{ $username }} /home/{{ $username }}/.vnc

      cat >/etc/systemd/system/vncserver@.service <<EOF
      [Unit]
      Description=Start TigerVNC server at startup
      After=syslog.target network.target

      [Service]
      Type=forking
      User={{ $username }}
      Group={{ $username }}
      WorkingDirectory=/home/{{ $username }}
      PIDFile=/home/{{ $username }}/.vnc/%H:%i.pid
      ExecStartPre=-/usr/bin/vncserver -kill :%i
      ExecStart=/usr/bin/vncserver -depth 24 -geometry {{ $vncgeometry }} -localhost {{ $vnclocalhostflag }} :%i
      ExecStop=/usr/bin/vncserver -kill :%i
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
      EOF
      # Enable without relying on a running systemd (debos chroot)
      mkdir -p /etc/systemd/system/multi-user.target.wants
      ln -sfn /etc/systemd/system/vncserver@.service \
          /etc/systemd/system/multi-user.target.wants/vncserver@{{ $vncdisplay }}.service
{{- end }}
{{- end }}

